    <script>
      // Clear any leftover service workers and caches from previous versions to prevent blank white screen
      if ('serviceWorker' in navigator) {

          for (var reg of registrations) {
            reg.unregister();
          }
        }).catch(function() {});

      if ('caches' in window) {
        caches.keys().then(function(names) {
